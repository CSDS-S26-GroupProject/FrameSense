services:
  # No env_file: Docker Compose's .env parser rejects JSON (e.g. FIREBASE_SERVICE_ACCOUNT_JSON).
  # backend/.env is still loaded by the app via load_dotenv + the bind mount below.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
