# Blueprint: https://render.com/docs/blueprint-spec
# Face-shape classifier Flask API (Linux). Gunicorn is correct here — Render never runs Windows.

services:
  - type: web
    name: framesense-face-shape-api
    runtime: python
    region: ohio
    plan: free
    rootDir: model/face_shape_classifier
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /health
